# --- Plugin coordinates -------------------------------------------------------
pluginGroup = fr.gryphou
# The version in development. A release takes its version from the git tag
# instead, so this is what unreleased builds are stamped from.
pluginVersion = 0.1.1

# --- Target platform ----------------------------------------------------------
# Build against a locally installed JetBrains IDE when it exists (fast, no
# download, guaranteed API match). Point this at any 2025.2+ IDE that bundles
# the Markdown plugin. If the directory is missing, the build falls back to
# downloading the WebStorm release named by `platformVersion`.
localIdeDir = /opt/webstorm
platformType = WS
platformVersion = 2026.2.1

# Compatibility range published in plugin.xml.
pluginSinceBuild = 252
# Left open on purpose: the preview extension API is stable across 2025.2+.
pluginUntilBuild =

# --- Build --------------------------------------------------------------------
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.caching = true
org.gradle.configuration-cache = true
kotlin.stdlib.default.dependency = false
